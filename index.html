<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>중학 영단어 마스터 [완전판]</title>
    <style>
        /* 폰트 설정 */
        @font-face { font-family: 'HanjinGroupSans'; src: url('./HanjinGroupSans-Light.ttf') format('truetype'); font-weight: 300; }
        @font-face { font-family: 'HanjinGroupSans'; src: url('./HanjinGroupSans-Regular.ttf') format('truetype'); font-weight: 400; }
        @font-face { font-family: 'HanjinGroupSans'; src: url('./HanjinGroupSans-Bold.ttf') format('truetype'); font-weight: 700; }

        :root {
            --kal-blue: #0064B2; --kal-navy: #00205B; --kal-light: #EBF3FA;
            --wrong-color: #D32F2F; --correct-color: #008000;
            --bg-color: #F8F9FA; --card-bg: #FFFFFF;
            --text-main: #222222; --text-muted: #666666; --border-color: #D0D9E1;
        }

        body.dark-mode {
            --kal-blue: #3399FF; --kal-navy: #66B2FF; --kal-light: #00205B;
            --wrong-color: #FF5252; --correct-color: #4CAF50;
            --bg-color: #0B132B; --card-bg: #1C2541;
            --text-main: #F0F4F8; --text-muted: #A0B2C6; --border-color: #2B3A55;
        }

        /* 부정행위(드래그) 방지 CSS */
        body {
            font-family: 'HanjinGroupSans', sans-serif; background-color: var(--bg-color); color: var(--text-main);
            margin: 0; display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh; transition: 0.3s; padding: 20px 15px; box-sizing: border-box;
            user-select: none; -webkit-user-select: none; /* 드래그 금지 */
        }
        
        /* 입력창은 타이핑을 위해 선택 허용 */
        input { user-select: auto; -webkit-user-select: auto; }

        #flashOverlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 9999; display: none; opacity: 0; transition: opacity 0.3s ease-out;
        }

        .container {
            background-color: var(--card-bg); width: 100%; max-width: 600px;
            border-radius: 16px; box-shadow: 0 10px 30px rgba(0,32,91,0.08);
            padding: 30px 25px; box-sizing: border-box; margin-bottom: 40px;
            border-top: 6px solid var(--kal-blue); transition: 0.3s; position: relative;
        }

        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .theme-toggle { background: none; border: 2px solid var(--border-color); color: var(--text-main); padding: 8px 14px; border-radius: 20px; font-weight: 700; cursor: pointer; font-family: 'HanjinGroupSans'; }
        
        .timer-group { display: flex; align-items: center; gap: 15px; }
        .timer { font-weight: 700; color: var(--wrong-color); font-size: 20px; letter-spacing: 1px;}
        .timer.paused { color: var(--kal-blue); opacity: 0.5; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 1; } }

        h1 { font-size: 28px; color: var(--kal-navy); margin: 0 0 10px 0; text-align: center; font-weight: 700; letter-spacing: -0.5px; }
        body.dark-mode h1 { color: var(--kal-blue); }

        .input-box { width: 100%; padding: 15px; border-radius: 8px; border: 2px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-size: 16px; font-weight: 700; font-family: 'HanjinGroupSans'; box-sizing: border-box; margin-bottom: 10px;}
        
        /* 모드 선택 UI */
        .mode-select-container { display: flex; gap: 15px; margin-bottom: 25px; }
        .mode-label { flex: 1; cursor: pointer; display: block; }
        .mode-label input[type="radio"] { display: none; } 
        .mode-box { border: 2px solid var(--border-color); border-radius: 12px; padding: 20px 10px; text-align: center; background: var(--card-bg); transition: all 0.2s ease; }
        .mode-title { font-size: 18px; font-weight: 700; color: var(--text-main); margin-bottom: 5px; }
        .mode-desc { font-size: 13px; color: var(--text-muted); font-weight: 400; line-height: 1.4; }
        .mode-label input[type="radio"]:checked + .mode-box { border-color: var(--kal-blue); background-color: var(--kal-light); box-shadow: 0 4px 12px rgba(0, 100, 178, 0.15); }
        .mode-label input[type="radio"]:checked + .mode-box .mode-title { color: var(--kal-blue); }

        .btn { display: block; width: 100%; padding: 18px; margin: 12px 0; border: none; border-radius: 8px; font-size: 18px; font-weight: 700; cursor: pointer; font-family: 'HanjinGroupSans'; transition: 0.2s; }
        .btn-primary { background-color: var(--kal-blue); color: #fff; }
        .btn-primary:hover { background-color: var(--kal-navy); }
        .btn-secondary { background-color: var(--kal-light); color: var(--kal-navy); border: 2px solid var(--kal-blue); }

        .screen { display: none; animation: fadeIn 0.3s ease-in-out; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* 상태바 (스코어보드 포함) */
        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 2px dashed var(--border-color); padding-bottom: 10px; }
        .progress-text { font-size: 17px; font-weight: 700; color: var(--kal-blue); }
        .score-board { font-size: 16px; font-weight: 700; display: flex; gap: 15px; }
        .score-board .ok { color: var(--correct-color); }
        .score-board .no { color: var(--wrong-color); }

        .quiz-word { font-size: 56px; font-weight: 700; color: var(--kal-navy); text-align: center; margin: 20px 0; line-height: 1.1; }
        body.dark-mode .quiz-word { color: #FFFFFF; }
        
        .sound-btn { background-color: var(--kal-light); border: 1px solid var(--kal-blue); color: var(--kal-navy); padding: 8px 16px; border-radius: 20px; font-weight: 700; cursor: pointer; display: block; margin: 0 auto 25px auto; font-family: 'HanjinGroupSans'; }

        .options-grid { display: grid; gap: 12px; }
        .option-btn { background-color: var(--card-bg); border: 2px solid var(--border-color); color: var(--text-main); padding: 22px; border-radius: 12px; font-size: 19px; font-weight: 700; cursor: pointer; transition: 0.1s; font-family: 'HanjinGroupSans'; line-height: 1.3; }
        .option-btn.correct { background-color: var(--correct-color) !important; color: white !important; border-color: var(--correct-color) !important; font-size: 21px; }
        .option-btn.wrong { background-color: var(--wrong-color) !important; color: white !important; border-color: var(--wrong-color) !important; font-size: 21px; }
        
        /* 3회 클릭 알림 */
        #testModeWarning { color: var(--wrong-color); font-weight: 700; text-align: center; margin-bottom: 15px; font-size: 16px; display: none; animation: blink 1s infinite; }

        /* 피드백 영역 */
        .feedback-area { margin-top: 30px; padding: 25px; background-color: var(--kal-light); border-radius: 12px; display: none; border-left: 6px solid var(--wrong-color); }
        .exp-step { background-color: var(--card-bg); padding: 18px; border-radius: 8px; font-size: 17px; line-height: 1.6; margin-bottom: 15px; border: 1px solid var(--border-color); color: var(--text-main); }
        .exp-step strong { color: var(--kal-navy); font-weight: 700; }
        body.dark-mode .exp-step strong { color: var(--kal-blue); }

        .typing-container { background-color: rgba(255,255,255,0.9); padding: 25px; border-radius: 12px; margin-top: 20px; border: 3px dashed var(--kal-blue); }
        body.dark-mode .typing-container { background-color: rgba(0,0,0,0.4); }
        .target-text { font-size: 32px; font-weight: 700; color: var(--wrong-color); text-align: center; margin-bottom: 15px; letter-spacing: 1px; }
        .guide-text { text-align: center; color: var(--kal-navy); font-weight: 700; margin-bottom: 10px; font-size: 16px; }

        .score-circle { width: 150px; height: 150px; background: var(--kal-blue); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 46px; font-weight: 700; margin: 30px auto; }
        .word-list-container { max-height: 60vh; overflow-y: auto; text-align: left; border: 2px solid var(--border-color); border-radius: 8px; padding: 15px; margin-bottom: 20px;}
        .word-item { padding: 12px 5px; border-bottom: 1px solid var(--border-color); }
    </style>
</head>

<body oncontextmenu="return false;" ondragstart="return false;" onselectstart="return false;">

<div id="flashOverlay"></div>

<div class="container">
    <div class="app-header">
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 다크 모드</button>
        <span id="timerText" class="timer" style="display: none;">⏱ 10:00</span>
    </div>

    <div id="menuScreen" class="screen active">
        <h1>영단어 마스터 [심화편]</h1>
        
        <div style="text-align: left; margin: 30px 0;">
            <label style="font-weight: 700; display: block; margin-bottom: 10px; color: var(--kal-navy);">⚙️ 문제 형태 선택</label>
            <div class="mode-select-container">
                <label class="mode-label">
                    <input type="radio" name="quizMode" value="practice" checked>
                    <div class="mode-box">
                        <div class="mode-title">모의고사</div>
                        <div class="mode-desc">오답 시 상세 해설<br>영/한 타이핑 강제 복습</div>
                    </div>
                </label>
                <label class="mode-label">
                    <input type="radio" name="quizMode" value="test">
                    <div class="mode-box">
                        <div class="mode-title">실전고사</div>
                        <div class="mode-desc">논스톱 타이머<br>오답 시 '정답 3회 터치'</div>
                    </div>
                </label>
            </div>

            <label style="font-weight: 700; display: block; margin-bottom: 10px; color: var(--kal-navy);">⏳ 시험 시간 설정 (분)</label>
            <input type="number" id="timeLimitInput" class="input-box" value="10" min="1" max="100">

            <label style="font-weight: 700; display: block; margin-bottom: 10px; color: var(--kal-navy); margin-top: 15px;">🎯 출제 범위 (단어 번호)</label>
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <input type="number" id="startNum" class="input-box" placeholder="시작" value="1701">
                <span style="font-size: 20px; font-weight: 700; line-height: 50px;">~</span>
                <input type="number" id="endNum" class="input-box" placeholder="끝" value="3000">
            </div>

            <label style="font-weight: 700; display: block; margin-bottom: 10px; color: var(--kal-navy);">📝 출제 문항 수</label>
            <select id="questionCountSelect" class="input-box">
                <option value="10">10문제</option>
                <option value="20">20문제</option>
                <option value="50">50문제</option>
                <option value="all">범위 전체 다 풀기</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="startQuiz()">📝 시험 시작하기</button>
        <button class="btn btn-secondary" onclick="showWordList()">📖 전체 단어장 보기</button>
    </div>

    <div id="quizScreen" class="screen">
        
        <div class="status-bar">
            <div class="progress-text" id="progressText">문제 1 / 10</div>
            <div class="score-board">
                <span class="ok">⭕ 정답: <span id="scoreCorrect">0</span></span>
                <span class="no">❌ 오답: <span id="scoreWrong">0</span></span>
            </div>
        </div>
        
        <div class="quiz-word" id="quizWord">Loading...</div>
        <button class="sound-btn" onclick="speakWord(document.getElementById('quizWord').innerText, 1)">🔊 발음 다시 듣기</button>

        <div id="testModeWarning">🚨 오답입니다! 정답 버튼을 3번 터치하여 확실히 외우세요!</div>

        <div class="options-grid" id="optionsGrid"></div>

        <div class="feedback-area" id="feedbackArea">
            <h3 style="color: var(--wrong-color); margin-top:0;">🚨 오답 노트 (타이머 일시정지)</h3>
            <div id="explanationContainer"></div>
            <button class="btn step-btn" id="stepConfirmBtn" onclick="showNextExplanationStep()">다음 문장 읽기 ➔</button>

            <div id="typingContainer" class="typing-container" style="display:none;">
                <div class="guide-text">STEP 1. 영단어를 똑같이 타이핑하세요.</div>
                <div class="target-text" id="targetEng"></div>
                <input type="text" id="typeEngInput" class="input-box" placeholder="영어 입력 (복붙 금지)" autocomplete="off" oninput="checkEngTyping(event)" onpaste="return false;" oncopy="return false;" oncut="return false;">

                <div id="korTypingSection" style="display:none; margin-top:25px;">
                    <div class="guide-text">STEP 2. 한글 뜻 타이핑 (괄호/점 무시)</div>
                    <div class="target-text" id="targetKor" style="font-size: 26px; color: var(--kal-navy);"></div>
                    <input type="text" id="typeKorInput" class="input-box" placeholder="한글 입력 (복붙 금지)" autocomplete="off" oninput="checkKorTyping(event)" onpaste="return false;" oncopy="return false;" oncut="return false;">
                </div>
                <button class="btn btn-primary" id="typingNextBtn" style="display:none; margin-top:25px;" onclick="nextQuestion()">✅ 복습 완료! 다음 문제 ➔</button>
            </div>
        </div>
    </div>

    <div id="resultScreen" class="screen">
        <h1 style="font-size: 32px;">시험 결과 리포트</h1>
        <div id="finalScore" class="score-circle"></div>
        <div id="resultMsg" style="text-align: center; font-size: 20px; margin-bottom: 30px; font-weight: 700; line-height: 1.8;"></div>
        <button class="btn btn-primary" onclick="goHome()">🏠 메인으로 돌아가기</button>
    </div>
</div>

function init() { 
    vocabList = rawData.trim().split('\n').map(line => {
        const parts = line.split('/').map(p => p.trim());
        if(parts.length >= 3) return { id: parseInt(parts[0]), word: parts[1], meaning: parts[2] };
        return null;
    }).filter(item => item);
    
    if(vocabList.length > 0) {
        document.getElementById('startNum').value = vocabList[0].id;
        document.getElementById('endNum').value = vocabList[vocabList.length-1].id;
    }
}

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.getElementById('timerText').style.display = (id === 'quizScreen') ? 'block' : 'none';
}

function goHome() {
    clearInterval(timerInterval);
    window.speechSynthesis.cancel();
    showScreen('menuScreen');
}

// 🔊 효과음 시스템
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playCorrectSound() {
    initAudio(); const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
    osc.connect(gainNode); gainNode.connect(audioCtx.destination); osc.type = 'sine';
    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); 
    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
}
function playWrongSound() {
    initAudio(); const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
    osc.connect(gainNode); gainNode.connect(audioCtx.destination); osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.setValueAtTime(100, audioCtx.currentTime + 0.2);
    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
}
function playClickSound() {
    initAudio(); const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
    osc.connect(gainNode); gainNode.connect(audioCtx.destination); osc.type = 'square';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
}

// 🧠 스마트 단어 출제 알고리즘 (골고루 출제)
function startQuiz() {
    initAudio(); 
    currentMode = document.querySelector('input[name="quizMode"]:checked').value;
    const minutes = parseInt(document.getElementById('timeLimitInput').value);
    if(isNaN(minutes) || minutes < 1) { alert("올바른 시간을 입력하세요."); return; }

    const start = parseInt(document.getElementById('startNum').value);
    const end = parseInt(document.getElementById('endNum').value);
    const targetList = vocabList.filter(v => v.id >= start && v.id <= end);
    if(targetList.length < 4) { alert("범위 내 단어가 너무 적습니다."); return; }

    const countVal = document.getElementById('questionCountSelect').value;
    const count = countVal === 'all' ? targetList.length : parseInt(countVal);

    // localStorage에서 단어별 출제 횟수 불러오기
    let stats = JSON.parse(localStorage.getItem('vocabStats') || '{}');
    
    // 출제 횟수가 적은 단어가 우선적으로 뽑히도록 가중치 정렬
    let weightedList = targetList.map(v => {
        let playCount = stats[v.id] || 0;
        return { ...v, weight: (playCount * 100) + Math.random() * 100 };
    });
    weightedList.sort((a, b) => a.weight - b.weight);
    
    quizQueue = weightedList.slice(0, count);

    // 출제된 단어 횟수 1 증가 후 저장
    quizQueue.forEach(v => { stats[v.id] = (stats[v.id] || 0) + 1; });
    localStorage.setItem('vocabStats', JSON.stringify(stats));

    currentIndex = 0; scoreOk = 0; scoreNo = 0; timeLeft = minutes * 60; isPaused = false;
    updateScoreBoard();

    if('speechSynthesis' in window) window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));

    showScreen('quizScreen');
    startTimer();
    loadQuestion();
}

function startTimer() {
    clearInterval(timerInterval);
    const timerEl = document.getElementById('timerText');
    timerEl.classList.remove('paused');
    
    timerInterval = setInterval(() => {
        if(!isPaused) {
            timeLeft--;
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            timerEl.innerText = `⏱ ${m}:${s<10?'0'+s:s}`;
            if(timeLeft <= 0) finishQuiz(true);
        } else {
            timerEl.classList.add('paused');
            timerEl.innerText = "⏸️ 일시정지 (복습 중)";
        }
    }, 1000);
}

function speakWord(word, times) {
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    
    let count = 0;
    function speak() {
        if(count >= times) return;
        const msg = new SpeechSynthesisUtterance(word);
        msg.lang = 'en-US';
        msg.rate = 0.85; 
        const voices = window.speechSynthesis.getVoices();
        const preferred = voices.find(v => v.name.includes("Google US English") || v.name.includes("Microsoft David")) || voices.find(v => v.lang === 'en-US');
        if(preferred) msg.voice = preferred;

        msg.onend = () => setTimeout(speak, 500);
        window.speechSynthesis.speak(msg);
        count++;
    }
    speak();
}

function updateScoreBoard() {
    document.getElementById('scoreCorrect').innerText = scoreOk;
    document.getElementById('scoreWrong').innerText = scoreNo;
}

function loadQuestion() {
    isPaused = false; 
    document.getElementById('timerText').classList.remove('paused');
    document.getElementById('testModeWarning').style.display = 'none';
    document.getElementById('feedbackArea').style.display = 'none';
    document.getElementById('typingContainer').style.display = 'none';
    document.getElementById('optionsGrid').style.pointerEvents = 'auto';

    if(currentIndex >= quizQueue.length) { finishQuiz(false); return; }

    const cur = quizQueue[currentIndex];
    
    document.getElementById('progressText').innerText = `문제 ${currentIndex + 1} / ${quizQueue.length}`;
    document.getElementById('quizWord').innerText = cur.word;

    speakWord(cur.word, 3); 

    // 오답 3개 무작위 추출
    let distractors = vocabList.filter(v => v.meaning !== cur.meaning).sort(() => Math.random() - 0.5).slice(0, 3);
    const options = [cur, ...distractors].sort(() => Math.random() - 0.5);

    const grid = document.getElementById('optionsGrid');
    grid.innerHTML = '';
    options.forEach(opt => {
        const btn = document.createElement('div');
        btn.className = 'option-btn';
        btn.innerText = opt.meaning;
        btn.onclick = () => checkAnswer(btn, opt, cur);
        grid.appendChild(btn);
    });
}

function checkAnswer(btn, selectedOpt, currentWord) {
    window.speechSynthesis.cancel(); 
    const isCorrect = selectedOpt.id === currentWord.id;
    const buttons = document.querySelectorAll('.option-btn');
    
    document.getElementById('optionsGrid').style.pointerEvents = 'none';

    if(isCorrect) {
        btn.classList.add('correct'); 
        scoreOk++;
        updateScoreBoard();
        playCorrectSound();
        flashScreen('rgba(0, 200, 0, 0.4)'); 
        setTimeout(() => { nextQuestion(); }, 800);
    } else {
        btn.classList.add('wrong');
        scoreNo++;
        updateScoreBoard();
        playWrongSound();
        flashScreen('rgba(255, 0, 0, 0.4)'); 

        if(currentMode === 'test') {
            // 실전고사 모드: 오답 시 정답을 3번 클릭하도록 유도
            document.getElementById('testModeWarning').style.display = 'block';
            document.getElementById('optionsGrid').style.pointerEvents = 'auto'; // 그리드 클릭 잠금 해제
            testModeClickCount = 0;

            buttons.forEach(b => {
                b.onclick = null; // 기존 클릭 이벤트 제거
                if(b.innerText === currentWord.meaning) {
                    b.classList.add('correct');
                    b.style.pointerEvents = 'auto'; // 정답 버튼만 활성화
                    b.onclick = () => {
                        testModeClickCount++;
                        playClickSound();
                        if(testModeClickCount === 1) b.innerText += ' (1/3)';
                        else if(testModeClickCount === 2) b.innerText = b.innerText.replace('(1/3)', '(2/3)');
                        else if(testModeClickCount >= 3) {
                            b.innerText = b.innerText.replace('(2/3)', '(✅ 완료)');
                            b.style.pointerEvents = 'none';
                            setTimeout(nextQuestion, 500);
                        }
                    };
                } else {
                    b.disabled = true;
                    b.style.pointerEvents = 'none';
                }
            });
        } else {
            // 모의고사 모드: 해설 및 타이핑
            buttons.forEach(b => { if(b.innerText === currentWord.meaning) b.classList.add('correct'); });
            isPaused = true; 
            startExplanation(currentWord);
        }
    }
}

function nextQuestion() { currentIndex++; loadQuestion(); }

function startExplanation(wordObj) {
    document.getElementById('feedbackArea').style.display = 'block';
    document.getElementById('explanationContainer').style.display = 'block';
    document.getElementById('stepConfirmBtn').style.display = 'block';
    document.getElementById('explanationContainer').innerHTML = '';
    
    const key = wordObj.word.toLowerCase();
    
    if(detailedExplanationDB[key]) {
        currentExpSteps = detailedExplanationDB[key];
    } else {
        currentExpSteps = [
            `💡 <strong>[뜻 확인]</strong> '${wordObj.word}'의 정확한 뜻은 <strong>'${wordObj.meaning}'</strong>입니다.`,
            `🔍 <strong>[복습]</strong> 눈으로만 보지 말고 소리 내어 읽으면서 타이핑을 준비하세요.`
        ];
    }
    currentStepIndex = 0;
    showNextExplanationStep();
}

function showNextExplanationStep() {
    const container = document.getElementById('explanationContainer');
    const btn = document.getElementById('stepConfirmBtn');
    
    const div = document.createElement('div');
    div.className = 'exp-step';
    div.innerHTML = currentExpSteps[currentStepIndex];
    container.appendChild(div);
    currentStepIndex++;

    if(currentStepIndex >= currentExpSteps.length) {
        btn.innerText = "✍️ 타이핑 복습 하러가기 (타이머 멈춤)";
        btn.onclick = startTypingPractice;
    }
}

function startTypingPractice() {
    document.getElementById('explanationContainer').style.display = 'none';
    document.getElementById('stepConfirmBtn').style.display = 'none';
    document.getElementById('typingContainer').style.display = 'block';
    
    const cur = quizQueue[currentIndex];
    document.getElementById('targetEng').innerText = cur.word;
    document.getElementById('targetKor').innerText = cur.meaning;
    
    const engInput = document.getElementById('typeEngInput');
    const korInput = document.getElementById('typeKorInput');
    
    engInput.value = ''; korInput.value = '';
    engInput.disabled = false; korInput.disabled = false;
    engInput.style.borderColor = "var(--border-color)";
    korInput.style.borderColor = "var(--border-color)";
    
    document.getElementById('korTypingSection').style.display = 'none';
    document.getElementById('typingNextBtn').style.display = 'none';
    
    speakWord(cur.word, 1);
    engInput.focus();
}

// 특수문자 및 띄어쓰기 완전 제거 함수
function cleanText(text) {
    return text.replace(/[().,\s]/g, '');
}

function checkEngTyping(e) {
    const cur = quizQueue[currentIndex];
    if(e.target.value.trim().toLowerCase() === cur.word.toLowerCase()) {
        e.target.disabled = true;
        e.target.style.borderColor = "var(--correct-color)";
        document.getElementById('korTypingSection').style.display = 'block';
        document.getElementById('typeKorInput').focus();
    }
}

function checkKorTyping(e) {
    const cur = quizQueue[currentIndex];
    if(cleanText(e.target.value) === cleanText(cur.meaning)) {
        e.target.disabled = true;
        e.target.style.borderColor = "var(--correct-color)";
        document.getElementById('typingNextBtn').style.display = 'block';
    }
}

function finishQuiz(isTimeout) {
    clearInterval(timerInterval);
    showScreen('resultScreen');
    
    const totalCount = quizQueue.length;
    const finalScore = Math.round((scoreOk / totalCount) * 100);
    
    document.getElementById('finalScore').innerText = finalScore + "점";
    
    let endMsg = isTimeout ? "⏰ 설정한 시험 시간이 종료되었습니다." : "🎉 수고하셨습니다! 시험을 완료했습니다.";
    
    document.getElementById('resultMsg').innerHTML = 
        endMsg + 
        `<br><br>총 ${totalCount}문제 중<br>` +
        `<span style="color:var(--correct-color); font-size:24px;">맞힌 문제: ${scoreOk}개</span><br>` +
        `<span style="color:var(--wrong-color); font-size:24px;">틀린 문제: ${scoreNo}개</span>`;
}

window.onload = init;
function toggleTheme() { document.body.classList.toggle('dark-mode'); }
function showWordList() {
    if(vocabList.length===0) init();
    const con = document.getElementById('wordListContainer');
    con.innerHTML = '';
    vocabList.forEach(v => {
        con.innerHTML += `<div class="word-item"><span class="en">${v.id}. ${v.word}</span><span class="ko">${v.meaning}</span></div>`;
    });
    showScreen('studyScreen');
}
</script>
