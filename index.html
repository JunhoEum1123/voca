<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>중학 영단어 마스터 [심화편]</title>
    <style>
        /* 한진그룹 폰트 적용 */
        @font-face { font-family: 'HanjinGroupSans'; src: url('./HanjinGroupSans-Light.ttf') format('truetype'); font-weight: 300; }
        @font-face { font-family: 'HanjinGroupSans'; src: url('./HanjinGroupSans-Regular.ttf') format('truetype'); font-weight: 400; }
        @font-face { font-family: 'HanjinGroupSans'; src: url('./HanjinGroupSans-Bold.ttf') format('truetype'); font-weight: 700; }

        /* 블루 & 네이비 컬러 팔레트 */
        :root {
            --kal-blue: #0064B2; --kal-navy: #00205B; --kal-light: #EBF3FA;
            --wrong-color: #D32F2F; --correct-color: #008000;
            --bg-color: #F8F9FA; --card-bg: #FFFFFF;
            --text-main: #222222; --text-muted: #555555; --border-color: #D0D9E1;
        }

        body.dark-mode {
            --kal-blue: #3399FF; --kal-navy: #66B2FF; --kal-light: #00205B;
            --wrong-color: #FF5252; --correct-color: #4CAF50;
            --bg-color: #0B132B; --card-bg: #1C2541;
            --text-main: #F0F4F8; --text-muted: #A0B2C6; --border-color: #2B3A55;
        }

        body {
            font-family: 'HanjinGroupSans', sans-serif; background-color: var(--bg-color); color: var(--text-main);
            margin: 0; display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh; transition: background-color 0.3s, color 0.3s; padding: 20px 15px; box-sizing: border-box;
        }

        @keyframes correctFlash { 0% { background-color: var(--bg-color); } 30% { background-color: rgba(0, 128, 0, 0.15); } 100% { background-color: var(--bg-color); } }
        body.flash-correct { animation: correctFlash 0.6s ease-out; }

        .container {
            background-color: var(--card-bg); width: 100%; max-width: 600px; /* 폭을 넓혀 가시성 확보 */
            border-radius: 16px; box-shadow: 0 10px 30px rgba(0,32,91,0.08);
            padding: 30px 25px; box-sizing: border-box; margin-bottom: 40px; transition: 0.3s;
            border-top: 6px solid var(--kal-blue);
        }

        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .theme-toggle { background: none; border: 2px solid var(--border-color); color: var(--text-main); padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: 700; font-size: 14px; font-family: 'HanjinGroupSans'; }
        .timer { font-weight: 700; color: var(--wrong-color); font-size: 18px; letter-spacing: 1px;}

        h1 { font-size: 26px; color: var(--kal-navy); margin: 0 0 10px 0; text-align: center; font-weight: 700; letter-spacing: -0.5px; }
        h2 { font-size: 16px; color: var(--text-muted); margin-bottom: 25px; text-align: center; font-weight: 400; }
        body.dark-mode h1 { color: var(--kal-blue); }

        .input-box { width: 100%; padding: 15px; border-radius: 8px; border: 2px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-size: 16px; outline: none; box-sizing: border-box; font-family: 'HanjinGroupSans'; font-weight: 700;}
        
        .btn { display: block; width: 100%; padding: 18px; margin: 12px 0; border: none; border-radius: 8px; font-size: 18px; font-weight: 700; cursor: pointer; box-sizing: border-box; text-align: center; font-family: 'HanjinGroupSans'; transition: 0.2s; letter-spacing: 0.5px;}
        .btn-primary { background-color: var(--kal-blue); color: #fff; }
        .btn-primary:hover { background-color: var(--kal-navy); }
        .btn-secondary { background-color: var(--kal-light); color: var(--kal-navy); border: 2px solid var(--kal-blue); }
        .btn-secondary:hover { background-color: #D0E3F5; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .screen { display: none; animation: fadeIn 0.3s ease-in-out; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* 퀴즈 메인 타이포그래피 강화 */
        .progress-text { font-size: 16px; font-weight: 700; color: var(--text-muted); margin-bottom: 10px; }
        
        .quiz-word-container { display: flex; flex-direction: column; align-items: center; margin: 25px 0 35px 0; }
        .quiz-word { font-size: 52px; font-weight: 700; color: var(--kal-navy); text-align: center; letter-spacing: -1px; margin-bottom: 15px; line-height: 1.1; }
        body.dark-mode .quiz-word { color: #FFFFFF; }
        
        /* 발음 듣기 재생 버튼 */
        .sound-btn { background-color: var(--kal-light); border: 1px solid var(--kal-blue); color: var(--kal-navy); font-size: 14px; font-weight: 700; padding: 8px 16px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; gap: 5px; font-family: 'HanjinGroupSans'; transition: 0.2s; }
        .sound-btn:hover { background-color: var(--kal-blue); color: white; }

        .options-grid { display: grid; gap: 12px; }
        .option-btn { background-color: var(--card-bg); border: 2px solid var(--border-color); color: var(--text-main); padding: 20px; border-radius: 10px; font-size: 18px; font-weight: 700; cursor: pointer; text-align: center; transition: 0.2s; font-family: 'HanjinGroupSans'; line-height: 1.4; }
        .option-btn.correct { background-color: var(--correct-color) !important; border-color: var(--correct-color) !important; color: white !important; font-size: 20px; }
        .option-btn.wrong { background-color: var(--wrong-color) !important; border-color: var(--wrong-color) !important; color: white !important; }
        .option-btn:hover:not([disabled]) { border-color: var(--kal-blue); color: var(--kal-blue); box-shadow: 0 4px 10px rgba(0,100,178,0.1);}

        /* 오답 피드백 영역 */
        .feedback-area { margin-top: 30px; padding: 25px 20px; background-color: var(--kal-light); border-radius: 8px; display: none; text-align: left; border-left: 5px solid var(--wrong-color); }
        .feedback-title { font-size: 18px; font-weight: 700; color: var(--wrong-color); margin-bottom: 20px; display:flex; align-items:center; gap:8px;}
        .exp-step { background-color: var(--card-bg); padding: 18px; border-radius: 8px; font-size: 16px; font-weight: 400; line-height: 1.6; color: var(--text-main); margin-bottom: 15px; border: 1px solid var(--border-color); animation: fadeIn 0.3s ease-in-out; }
        .exp-step strong { font-weight: 700; color: var(--kal-navy); font-size: 17px; }
        body.dark-mode .exp-step strong { color: var(--kal-blue); }
        .step-btn { background-color: var(--kal-navy); color: #fff; margin-top: 20px; font-size: 16px; }

        /* 타이핑 복습 영역 - 글자 크기 극대화 */
        .typing-container { background-color: rgba(255,255,255,0.8); padding: 25px; border-radius: 12px; margin-top: 15px; border: 3px dashed var(--kal-blue); animation: fadeIn 0.3s ease-in-out; }
        body.dark-mode .typing-container { background-color: rgba(0,0,0,0.3); }
        .typing-step-title { font-size: 16px; font-weight: 700; color: var(--kal-navy); margin-bottom: 12px; }
        body.dark-mode .typing-step-title { color: var(--kal-blue); }
        
        .target-word { font-size: 32px; font-weight: 700; color: var(--wrong-color); margin-bottom: 15px; letter-spacing: 1px; text-align: center; }
        .target-meaning { font-size: 24px; font-weight: 700; color: var(--kal-navy); margin-bottom: 15px; text-align: center; }
        body.dark-mode .target-meaning { color: var(--kal-blue); }

        .score-circle { width: 140px; height: 140px; background: var(--kal-blue); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 40px; font-weight: 700; margin: 30px auto; box-shadow: 0 10px 20px rgba(0,100,178,0.3);}
    </style>
</head>
<body>

<div class="container">
    <div class="app-header">
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 다크 모드</button>
        <span id="timerText" class="timer" style="display: none;">⏱ 10:00</span>
    </div>

    <div id="menuScreen" class="screen active">
        <h1>중학 영단어 마스터 [심화편]</h1>
        <h2>음성 자동 읽기 & 타이핑 강제 복습 시스템</h2>
        
        <div style="text-align: left; margin: 30px 0;">
            <label style="font-weight: 700; display: block; margin-bottom: 10px; font-size: 15px; color: var(--kal-navy);">🎯 시험 범위 (단어 번호)</label>
            <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 25px;">
                <input type="number" id="startNum" class="input-box" placeholder="시작 번호">
                <span style="font-weight: 700; font-size: 18px; color:var(--text-muted);">~</span>
                <input type="number" id="endNum" class="input-box" placeholder="끝 번호">
            </div>

            <label style="font-weight: 700; display: block; margin-bottom: 10px; font-size: 15px; color: var(--kal-navy);">📝 출제 문항 수</label>
            <select id="questionCountSelect" class="input-box">
                <option value="10">10문제 (가볍게 테스트)</option>
                <option value="20">20문제 (실전 테스트)</option>
                <option value="50">50문제 (집중 테스트)</option>
                <option value="all">범위 내 전체 다 풀기</option>
            </select>
        </div>

        <button class="btn btn-primary" onclick="startQuiz()">📝 시험 시작하기</button>
        <button class="btn btn-secondary" onclick="showWordList()">📖 전체 단어장 보기</button>
    </div>

    <div id="studyScreen" class="screen">
        <h1 style="margin-bottom: 20px; text-align:left;">📖 Vocabulary List</h1>
        <div class="word-list-container" id="wordListContainer" style="max-height: 60vh; overflow-y: auto; text-align: left; border: 2px solid var(--border-color); border-radius: 8px; padding: 15px; margin-bottom: 20px;"></div>
        <button class="btn btn-secondary" onclick="goHome()">🏠 메인 화면으로 돌아가기</button>
    </div>

    <div id="quizScreen" class="screen">
        <div class="progress-text" id="progressText">문제 1 / 10</div>
        
        <div class="quiz-word-container">
            <div class="quiz-word" id="quizWord">Loading...</div>
            <button class="sound-btn" onclick="speakWord(document.getElementById('quizWord').innerText, 1)">
                🔊 발음 다시 듣기
            </button>
        </div>

        <div class="options-grid" id="optionsGrid"></div>

        <div class="feedback-area" id="feedbackArea">
            <div class="feedback-title">⚠️ 오답입니다. 심층 해설을 꼼꼼히 확인하세요.</div>
            <div id="explanationContainer"></div>
            <button class="btn step-btn" id="stepConfirmBtn" onclick="showNextExplanationStep()">다음 문장 확인 ➔</button>

            <div id="typingContainer" class="typing-container" style="display:none;">
                <div class="typing-step-title">✍️ [1단계] 아래 영단어를 똑같이 타이핑하세요.</div>
                <div class="target-word" id="targetEng"></div>
                <input type="text" id="typeEngInput" class="input-box" placeholder="영어 단어 정확히 입력" autocomplete="off" oninput="checkEngTyping(event)">

                <div id="korTypingSection" style="display:none; margin-top:25px;">
                    <div class="typing-step-title">✍️ [2단계] 아래 한글 뜻을 띄어쓰기까지 똑같이 타이핑하세요.</div>
                    <div class="target-meaning" id="targetKor"></div>
                    <input type="text" id="typeKorInput" class="input-box" placeholder="한글 뜻 정확히 입력" autocomplete="off" oninput="checkKorTyping(event)">
                </div>

                <button class="btn btn-primary" id="typingNextBtn" style="display:none; margin-top:25px;" onclick="nextQuestion()">✅ 완벽합니다! 다음 문제로 ➔</button>
            </div>
        </div>
    </div>

    <div id="resultScreen" class="screen">
        <h1 style="margin-top: 10px;">📊 시험 결과 리포트</h1>
        <div id="finalScore" class="score-circle">90점</div>
        <div id="resultMsg" style="font-size: 18px; font-weight: 700; margin-bottom: 30px; line-height: 1.6; color: var(--text-main); text-align: center;"></div>
        <button class="btn btn-primary" onclick="goHome()">🏠 메인 화면으로 돌아가기</button>
    </div>
</div>

let vocabList = [];
let quizQueue = [];
let currentIndex = 0;
let score = 0;
let timerInterval = null;
let timeLeft = 600;
let currentExpSteps = [];
let currentStepIndex = 0;

function init() { 
    vocabList = parseData(rawData); 
    if(vocabList.length > 0) {
        document.getElementById('startNum').value = vocabList[0].id;
        document.getElementById('endNum').value = vocabList[vocabList.length - 1].id;
    }
}

function parseData(text) {
    return text.trim().split('\n').map(line => {
        const parts = line.split('/').map(p => p.trim());
        if (parts.length >= 3) return { id: parseInt(parts[0], 10), word: parts[1], meaning: parts[2] };
        return null;
    }).filter(item => item !== null && !isNaN(item.id));
}

function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
    const target = document.getElementById(screenId);
    target.style.display = 'block';
    setTimeout(() => target.classList.add('active'), 10);
    document.getElementById('timerText').style.display = (screenId === 'quizScreen') ? 'block' : 'none';
}

function goHome() { 
    clearInterval(timerInterval); 
    window.speechSynthesis.cancel();
    showScreen('menuScreen'); 
    window.scrollTo(0,0); 
}

function toggleTheme() {
    const body = document.body;
    const btn = document.getElementById('themeBtn');
    body.classList.toggle('dark-mode');
    btn.innerText = body.classList.contains('dark-mode') ? '☀️ 라이트 모드' : '🌙 다크 모드';
}

function showWordList() {
    if(vocabList.length === 0) init();
    const container = document.getElementById('wordListContainer');
    container.innerHTML = '';
    vocabList.forEach(v => {
        const div = document.createElement('div');
        div.className = 'word-item';
        div.innerHTML = `<span class="en">${v.id}. ${v.word}</span> <span class="ko">${v.meaning}</span>`;
        container.appendChild(div);
    });
    showScreen('studyScreen');
}

function startQuiz() {
    if(vocabList.length === 0) init();

    const startIdx = parseInt(document.getElementById('startNum').value, 10);
    const endIdx = parseInt(document.getElementById('endNum').value, 10);

    if (startIdx > endIdx) { alert("시작 번호가 끝 번호보다 클 수 없습니다."); return; }

    let rangedList = vocabList.filter(v => v.id >= startIdx && v.id <= endIdx);
    if (rangedList.length < 4) { alert("최소 4단어 이상 지정해주세요."); return; }

    const countSelect = document.getElementById('questionCountSelect').value;
    const count = countSelect === 'all' ? rangedList.length : parseInt(countSelect);
    
    let shuffled = [...rangedList].sort(() => Math.random() - 0.5);
    quizQueue = shuffled.slice(0, count);
    
    currentIndex = 0; score = 0; timeLeft = 600;
    
    if('speechSynthesis' in window) {
        let msg = new SpeechSynthesisUtterance('');
        msg.volume = 0; window.speechSynthesis.speak(msg);
    }
    
    showScreen('quizScreen'); startTimer(); loadQuestion();
}

function startTimer() {
    clearInterval(timerInterval);
    document.getElementById('timerText').style.display = 'block';
    timerInterval = setInterval(() => {
        timeLeft--;
        const min = Math.floor(timeLeft / 60);
        const sec = timeLeft % 60;
        document.getElementById('timerText').innerText = `⏱ ${min}:${sec < 10 ? '0'+sec : sec}`;
        if (timeLeft <= 0) { clearInterval(timerInterval); finishQuiz(true); }
    }, 1000);
}

function speakWord(word, times) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    let count = 0;
    function speakNext() {
        if (count >= times) return;
        let msg = new SpeechSynthesisUtterance(word);
        msg.lang = 'en-US';
        msg.rate = 0.85; 
        msg.onend = function() {
            setTimeout(speakNext, 500); 
        };
        window.speechSynthesis.speak(msg);
        count++;
    }
    speakNext();
}

function getTrickyDistractors(correctMeaning, allVocabs) {
    let distractors = [];
    let pool = allVocabs.filter(v => v.meaning !== correctMeaning);
    let isVerb = correctMeaning.endsWith('다');
    let isAdjective = correctMeaning.endsWith('한') || correctMeaning.endsWith('적인') || correctMeaning.endsWith('운') || correctMeaning.endsWith('의');
    let isAdverb = correctMeaning.endsWith('히') || correctMeaning.endsWith('으로');

    let trickyPool = [];
    if (isVerb) trickyPool = pool.filter(v => v.meaning.endsWith('다'));
    else if (isAdjective) trickyPool = pool.filter(v => v.meaning.endsWith('한') || v.meaning.endsWith('적인') || v.meaning.endsWith('운') || v.meaning.endsWith('의'));
    else if (isAdverb) trickyPool = pool.filter(v => v.meaning.endsWith('히') || v.meaning.endsWith('으로'));
    
    if (trickyPool.length > 0) {
        trickyPool.sort(() => Math.random() - 0.5);
        for(let i=0; i<trickyPool.length && distractors.length < 3; i++) distractors.push(trickyPool[i].meaning);
    }
    
    pool.sort(() => Math.random() - 0.5);
    for(let i=0; distractors.length < 3 && i < pool.length; i++) {
        if(!distractors.includes(pool[i].meaning)) distractors.push(pool[i].meaning);
    }
    return distractors;
}

function loadQuestion() {
    document.getElementById('feedbackArea').style.display = 'none';
    document.getElementById('explanationContainer').style.display = 'none';
    document.getElementById('stepConfirmBtn').style.display = 'block';
    document.getElementById('typingContainer').style.display = 'none';
    document.getElementById('optionsGrid').style.pointerEvents = 'auto';
    
    if (currentIndex >= quizQueue.length) { finishQuiz(false); return; }

    const currentWord = quizQueue[currentIndex];
    document.getElementById('progressText').innerText = `문제 ${currentIndex + 1} / ${quizQueue.length}`;
    document.getElementById('quizWord').innerText = currentWord.word;

    speakWord(currentWord.word, 3);

    let distractors = getTrickyDistractors(currentWord.meaning, vocabList);
    let options = [currentWord.meaning, ...distractors].sort(() => Math.random() - 0.5);

    const grid = document.getElementById('optionsGrid');
    grid.innerHTML = '';
    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(btn, opt, currentWord);
        grid.appendChild(btn);
    });
}

function checkAnswer(btn, selectedText, currentWord) {
    window.speechSynthesis.cancel(); 
    const buttons = document.querySelectorAll('.option-btn');
    document.getElementById('optionsGrid').style.pointerEvents = 'none';

    if (selectedText === currentWord.meaning) {
        btn.classList.add('correct'); score++;
        document.body.classList.add('flash-correct');
        setTimeout(() => document.body.classList.remove('flash-correct'), 600);
        setTimeout(nextQuestion, 800); 
    } else {
        btn.classList.add('wrong');
        buttons.forEach(b => { 
            if(b.innerText === currentWord.meaning) b.classList.add('correct');
            else b.disabled = true; 
        });
        startExplanation(currentWord);
    }
}

function nextQuestion() { currentIndex++; loadQuestion(); }

function startExplanation(wordObj) {
    document.getElementById('feedbackArea').style.display = 'block';
    document.getElementById('explanationContainer').style.display = 'block';
    const container = document.getElementById('explanationContainer');
    container.innerHTML = ''; 
    
    const wordKey = wordObj.word.toLowerCase();
    
    if (detailedExplanationDB[wordKey]) {
        currentExpSteps = detailedExplanationDB[wordKey];
    } else {
        currentExpSteps = [];
        currentExpSteps.push(`💡 <strong>[기본 뜻 확인]</strong> 아쉽네요! '${wordObj.word}'의 진짜 뜻은 <strong>'${wordObj.meaning}'</strong>입니다.`);
        
        let affixFound = false;
        if (wordKey.endsWith("tion") || wordKey.endsWith("ment") || wordKey.endsWith("ness")) {
            currentExpSteps.push(`🔍 <strong>[구조 힌트]</strong> 단어가 <strong>'-${wordKey.substring(wordKey.length-4)}'</strong>로 끝나고 있죠? 보통 상태를 나타내는 '명사'가 됩니다.`);
            affixFound = true;
        } else if (wordKey.endsWith("ly")) {
            currentExpSteps.push(`🔍 <strong>[구조 힌트]</strong> 단어 끝에 <strong>'-ly'</strong>가 붙어있네요. 형용사 뒤에 붙어서 '~하게'라는 '부사'를 만듭니다.`);
            affixFound = true;
        }

        if (wordKey.startsWith("un") || wordKey.startsWith("in") || wordKey.startsWith("im") || wordKey.startsWith("dis")) {
            currentExpSteps.push(`🔍 <strong>[어원 힌트]</strong> 앞부분의 <strong>'${wordKey.substring(0,2)}-'</strong>는 보통 '반대(not)'의 의미를 가집니다.`);
            affixFound = true;
        } else if (wordKey.startsWith("re")) {
            currentExpSteps.push(`🔍 <strong>[어원 힌트]</strong> <strong>'re-'</strong>는 '다시(again)'나 '뒤로(back)'라는 뜻을 더해주는 마법의 접두사입니다.`);
            affixFound = true;
        }

        if (!affixFound) {
            currentExpSteps.push(`🔍 <strong>[어원 팁]</strong> 이 단어는 접두사보다는 어근 자체가 핵심입니다. 발음을 소리내어 여러 번 읽어보세요!`);
        }
        currentExpSteps.push(`📝 뜻 '${wordObj.meaning}'과 영어 발음을 엮어서 연상 문장을 한 번 만들어보세요!`);
    }
    
    currentStepIndex = 0;
    showNextExplanationStep();
}

function showNextExplanationStep() {
    const container = document.getElementById('explanationContainer');
    const btn = document.getElementById('stepConfirmBtn');
    
    const stepDiv = document.createElement('div');
    stepDiv.className = 'exp-step';
    stepDiv.innerHTML = currentExpSteps[currentStepIndex];
    container.appendChild(stepDiv);
    
    currentStepIndex++;
    
    if (currentStepIndex < currentExpSteps.length) {
        btn.innerText = `확인! 다음 문장 확인 (${currentStepIndex}/${currentExpSteps.length}) ➔`;
        btn.onclick = showNextExplanationStep; 
    } else {
        btn.innerText = `✍️ 영단어 & 한글 타이핑 복습하기 ➔`;
        btn.onclick = startTypingPractice; 
    }
}

function startTypingPractice() {
    document.getElementById('explanationContainer').style.display = 'none';
    document.getElementById('stepConfirmBtn').style.display = 'none';
    document.getElementById('typingContainer').style.display = 'block';
    
    const cw = quizQueue[currentIndex];
    document.getElementById('targetEng').innerText = cw.word;
    document.getElementById('targetKor').innerText = cw.meaning;
    
    const engInput = document.getElementById('typeEngInput');
    const korInput = document.getElementById('typeKorInput');
    
    engInput.value = '';
    korInput.value = '';
    engInput.disabled = false;
    korInput.disabled = false;
    engInput.style.borderColor = "var(--border-color)";
    korInput.style.borderColor = "var(--border-color)";
    
    document.getElementById('korTypingSection').style.display = 'none';
    document.getElementById('typingNextBtn').style.display = 'none';
    
    speakWord(cw.word, 1);
    engInput.focus();
}

function checkEngTyping(e) {
    const cw = quizQueue[currentIndex];
    const input = e.target.value.trim().toLowerCase();
    if (input === cw.word.toLowerCase()) {
        e.target.disabled = true; 
        e.target.style.borderColor = "var(--correct-color)";
        document.getElementById('korTypingSection').style.display = 'block';
        document.getElementById('typeKorInput').focus();
    }
}

function checkKorTyping(e) {
    const cw = quizQueue[currentIndex];
    const input = e.target.value.trim();
    if (input === cw.meaning.trim()) {
        e.target.disabled = true;
        e.target.style.borderColor = "var(--correct-color)";
        document.getElementById('typingNextBtn').style.display = 'block';
    }
}

function finishQuiz(isTimeOut) {
    clearInterval(timerInterval);
    showScreen('resultScreen');
    window.scrollTo(0,0);
    
    const total = quizQueue.length;
    const finalScore = Math.round((score / total) * 100);
    const scoreCircle = document.getElementById('finalScore');
    scoreCircle.innerText = finalScore + "점";
    
    let msg = isTimeOut ? "⏰ 시간이 초과되어 남은 문제는 오답 처리되었습니다.<br><br>" : "";
    
    if (finalScore === 100) { msg += "🏆 퍼펙트! 시험을 완벽하게 통과했습니다."; scoreCircle.style.backgroundColor = "var(--correct-color)"; } 
    else if (finalScore >= 80) { msg += "👏 훌륭한 성적입니다! 복습한 단어는 절대 잊지 않을 거예요."; scoreCircle.style.backgroundColor = "var(--kal-blue)"; } 
    else { msg += "💪 조금 더 노력이 필요합니다. 직접 타이핑하며 복습한 단어들을 기억하세요!"; scoreCircle.style.backgroundColor = "var(--wrong-color)"; }
    document.getElementById('resultMsg').innerHTML = msg;
}

window.onload = init;
</script>
